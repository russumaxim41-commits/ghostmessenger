kind = "mobile"
previewPath = "/"
title = "Ghost Messenger"
version = "1.0.0"
id = "artifacts/ghost"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22726

[services.development]
run = "pnpm --filter @workspace/ghost run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ghost", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ghost", "run", "serve" ]

[services.env]
PORT = "22726"
BASE_PATH = "/"
