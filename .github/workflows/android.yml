name: Build Android
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build APK (Debug)
        run: |
          # Устанавливаем Expo CLI локально для сборки
          pnpm add -g expo-cli
          # Команда для сборки локального APK (Debug версия)
          npx expo run:android --variant release --no-install

