name: Build Android
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Fix package.json for Build
        run: |
          # 1. Удаляем проблемную workspace-зависимость
          sed -i '/@workspace\/api-client-react/d' package.json
          
          # 2. Заменяем "catalog:" на "*" (любая версия), чтобы pnpm не выдавал ошибку
          # Это позволит pnpm самому подобрать подходящую версию библиотеки
          sed -i 's/catalog:/*/g' package.json
          
          # 3. Чистим синтаксис JSON после правок
          sed -i 's/,,/,/g' package.json
          sed -i 's/, \}/ \}/g' package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build Project
        run: npx expo export
