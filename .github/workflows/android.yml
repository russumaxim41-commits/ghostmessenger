name: Build Android
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Fix Workspace Dependencies
        run: |
          # Удаляем проблемную зависимость из package.json перед установкой
          # Это техническая правка только для сервера сборки
          sed -i '/@workspace\/api-client-react/d' package.json
          # Исправляем возможные ошибки в JSON после удаления строки
          sed -i 's/,,/,/g' package.json
          sed -i 's/, \}/ \}/g' package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build Project
        run: npx expo export
